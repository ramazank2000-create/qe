services:
  qe:
    build: .
    container_name: qe
    environment:
      OMP_NUM_THREADS: 4
      QE_ROOT: /opt/qe-7.5
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      OMPI_MCA_btl_vader_single_copy_mechanism: none
    volumes:
      - qe_home:/home/qe
      - ./jobs_qe:/home/qe/jobs_qe
    ulimits:
      stack: -1
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  qe_home:
