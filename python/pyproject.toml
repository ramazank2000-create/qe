[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-ase"
version = "0.1.0"
description = "ASE helpers for the Quantum ESPRESSO Docker environment"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.23.0",
]

[tool.setuptools]
packages = ["qe_ase"]
